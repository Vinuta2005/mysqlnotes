["28","Sep 28 · SQL_D01","Introduction to Databases","Data, database, DBMS, RDBMS, SQL vs MySQL, entities.",[
["Data and database","Data = simple facts and figures. Database = a large collection of data.","","Old shops used paper registers: no security (fire), ink fades, and totals across shops are slow. Computer databases solve this."],
["DBMS","Software that stores and manages the database (insert, update, delete, manage the whole database). It runs in RAM; data is stored on the hard disk.","",""],
["SQL vs MySQL","SQL is a language (Structured Query Language). MySQL is software (an RDBMS) in which you write SQL, like Java (language) and Eclipse (tool).","",""],
["RDBMS","A DBMS that stores data in tables and lets you relate tables. MySQL, Oracle, Sybase, DB2 are RDBMS vendors; learning MySQL covers ~90% of the others.","",""],
["Entity","Any real-world object. Physical: can be seen/touched (student). Conceptual: cannot (course, order). Properties of an entity become columns.","","Swiggy entities: customer, restaurant, food item, delivery person, order."]],
["Data = facts; database = collection of data","SQL = language, MySQL = software","Give a real example in interviews"],

["30","Sep 30 · SQL_D03","ER Diagram → Relational Schema","Convert entities to tables; primary and foreign keys; handling 1:1, 1:N, M:N.",[
["Entity → table","Entity = table name, attribute = column, key attribute = primary key, each row = one record.","",""],

["1","Oct 1 · SQL_D04","Data Types & Constraints","Basic commands, data types, CREATE TABLE, INSERT, constraints.",[

const KW='SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|INSERT INTO|VALUES|UPDATE|SET|DELETE|CREATE TABLE|CREATE DATABASE|DROP TABLE|DROP|ALTER TABLE|ADD|MODIFY|RENAME|TRUNCATE|PRIMARY KEY|FOREIGN KEY|REFERENCES|CONSTRAINT|CHECK|UNIQUE|DEFAULT|NOT NULL|AND|OR|NOT|IN|IS|NULL|LIKE|BETWEEN|AS|DISTINCT|CASE|WHEN|THEN|ELSE|END|OVER|PARTITION BY|USE|SHOW|DESC|REGEXP';
const hl=s=>esc(s).replace(/'[^']*'/g,'<i>$&</i>').replace(new RegExp('\\b('+KW+')\\b','g'),'<b>$1</b>');
const code=s=>`<div class="code"><button class="cp" onclick="cp(this)">Copy</button><pre>${hl(s)}</pre></div>`;
function cp(b){const t=b.nextElementSibling.innerText;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='Copied ✓',()=>{const r=document.createRange();r.selectNodeContents(b.nextElementSibling);getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='Selected – press Ctrl+C'});setTimeout(()=>b.textContent='Copy',1800)}
function sv(){try{localStorage.setItem('p',JSON.stringify(P))}catch(e){}}
function tog(i,v){P[i]=v;sv()}
function go(id){const e=document.getElementById(id);if(e){e.open=true;e.scrollIntoView({behavior:'smooth'})}}
function pick(b,n,k){const c=b.closest('.card');c.querySelectorAll('.opt').forEach((o,j)=>{o.disabled=true;if(j==k)o.classList.add('ok');else if(o===b)o.classList.add('bad')});c.querySelector('.ans').classList.add('show')}
function ans(a,x){return (a[0]=='#'?code(a.slice(1)):`<p><b>Answer:</b> ${esc(a)}</p>`)+(x?`<p class="mu">${esc(x)}</p>`:'')}
function qc(q,id){const [t,a,x,o]=q;return `<div class="card" id="${id}"><b>Q.</b> ${esc(t)}${o?o.map((s,n)=>`<button class="opt" onclick="pick(this,${n},${q[4]})">${String.fromCharCode(65+n)}. ${esc(s)}</button>`).join(''):''}${o?'':`<br><button onclick="this.nextElementSibling.classList.toggle('show')">Show / hide answer</button>`}<div class="ans${o?'':''}">${ans(a,x)}</div></div>`}
function cc(c,id){return `<details id="${id}" open><summary>${esc(c[0])}</summary>${c[1]?`<p><b>Meaning:</b> ${esc(c[1])}</p>`:''}${c[2]?'<p><b>Syntax / example:</b></p>'+code(c[2]):''}${c[3]?`<p class="${/Correction|Added/.test(c[3])?'fix':''}">${esc(c[3])}</p>`:''}</details>`}
function home(){const d=Object.values(P).filter(Boolean).length;return `<h1>MySQL Learning Hub — Complete Class Notes</h1><p class="mu">14 classes. Class numbers are the class dates (28 Sep – 16 Oct 2026).</p><div class="bar"><i style="width:${d/14*100}%"></i></div><p class="mu">${d}/14 complete</p><div class="grid">${C.map((k,i)=>`<a class="cc" href="#c${i}"><span class="num">CLASS ${k[0]} · ${k[1]}</span><h3 style="margin:.3em 0">${esc(k[2])} ${P[i]?'<b>✓</b>':''}</h3><span class="mu">${esc(k[3])}</span><br><span>Open notes →</span></a>`).join('')}</div>`}
function cls(i){const k=C[i];return `<div class="nav"><a href="#">← Home</a><span>${i>0?`<a href="#c${i-1}">← Class ${C[i-1][0]}</a>`:''} ${i<13?`<a href="#c${i+1}">Class ${C[i+1][0]} →</a>`:''}</span></div><h1>Class ${k[0]} — ${esc(k[2])}</h1><p class="mu">${k[1]} · ${esc(k[3])}</p><div class="card toc"><b>Contents:</b><br>${k[4].map((c,j)=>`<a href="javascript:go('c${i}-${j}')">${esc(c[0])}</a>`).join('')}<a href="javascript:go('q${i}-0')">Questions</a></div>${k[4].map((c,j)=>cc(c,`c${i}-${j}`)).join('')}<h2>Exam points</h2><div class="card"><ul>${k[5].map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div><h2>Practice questions</h2>${k[6].map((q,j)=>qc(q,`q${i}-${j}`)).join('')}<label class="card" style="display:block"><input type="checkbox" ${P[i]?'checked':''} onchange="tog(${i},this.checked)"> Mark class complete</label>`}
const ref=()=>`<div class="nav"><a href="#">← Home</a></div><h1>Quick reference</h1><table>${REF.map(r=>`<tr><td>${esc(r[0])}</td><td>${code(r[1])}</td></tr>`).join('')}</table>`;
const rev=()=>`<div class="nav"><a href="#">← Home</a></div><h1>Revision</h1>${C.map((k,i)=>`<details><summary>Class ${k[0]} — ${esc(k[2])}</summary><ul>${k[5].map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p class="mu">Topics: ${k[4].map(c=>esc(c[0])).join(' · ')}</p></details>`).join('')}`;
function route(){const h=location.hash.slice(1),top=`<div class="top"><input id="s" placeholder="Search concepts, keywords, queries…" oninput="srch(this.value)"><a href="#ref"><button>Quick reference</button></a><a href="#rev"><button>Revision</button></a></div><div id="b"></div>`;m.innerHTML=top;const b=$('#b');b.innerHTML=h=='ref'?ref():h=='rev'?rev():/^c\d+$/.test(h)&&C[+h.slice(1)]?cls(+h.slice(1)):home();scrollTo(0,0)}
function srch(v){v=v.trim().toLowerCase();const b=$('#b');if(!v){route2();return}const r=[];C.forEach((k,i)=>{k[4].forEach((c,j)=>{if(c.join(' ').toLowerCase().includes(v))r.push([i,c[0],c[1]||c[2].slice(0,90)])});k[6].forEach(q=>{if(q.slice(0,3).join(' ').toLowerCase().includes(v))r.push([i,'Q: '+q[0],''])})});b.innerHTML=`<h2>${r.length} result(s)</h2>`+r.map(x=>`<a class="cc" href="#c${x[0]}" onclick="$('#s').value=''"><span class="num">CLASS ${C[x[0]][0]}</span><br><b>${esc(x[1])}</b><br><span class="mu">${esc(x[2])}</span></a>`).join('')}
function route2(){const s=$('#s').value;route();$('#s').value=s}
addEventListener('hashchange',route);route();</script></body></html>
